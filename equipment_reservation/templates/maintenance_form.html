{% extends "base.html" %}

{% block title %}Bakım Kaydı Ekle - {{ equipment.name }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <h2><i class="fas fa-wrench"></i> Bakım Kaydı Ekle</h2>
        <hr>

        <div class="card">
            <div class="card-header bg-info text-white">
                <h5>{{ equipment.name }}</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="maintenance_type" class="form-label">Bakım Tipi</label>
                        <select class="form-select" id="maintenance_type" name="maintenance_type" required>
                            <option value="calibration">Kalibrasyon</option>
                            <option value="repair">Onarım</option>
                            <option value="routine_check">Rutin Kontrol</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Açıklama</label>
                        <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="performed_by" class="form-label">Yapan Kişi</label>
                            <input type="text" class="form-control" id="performed_by" name="performed_by"
                                   value="{{ current_user.full_name or current_user.username }}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="performed_at" class="form-label">Bakım Tarihi</label>
                            <input type="datetime-local" class="form-control" id="performed_at" name="performed_at" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="cost" class="form-label">Maliyet (TL)</label>
                        <input type="number" step="0.01" class="form-control" id="cost" name="cost" value="0">
                    </div>

                    <div class="mb-3">
                        <label for="notes" class="form-label">Notlar</label>
                        <textarea class="form-control" id="notes" name="notes" rows="2"></textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save"></i> Kaydet
                        </button>
                        <a href="{{ url_for('equipment_detail', id=equipment.id) }}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> İptal
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Set default datetime to now
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('performed_at').value = now.toISOString().slice(0, 16);
</script>
{% endblock %}

{% extends "base.html" %}

{% block title %}Rezervasyon Takvimi{% endblock %}

{% block extra_css %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
<style>
    #calendar {
        max-width: 1200px;
        margin: 0 auto;
    }
    .fc-event {
        cursor: pointer;
    }
</style>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2><i class="fas fa-calendar"></i> Rezervasyon Takvimi</h2>
        <hr>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <div id="calendar"></div>
            </div>
        </div>
    </div>
</div>

<!-- Event Details Modal -->
<div class="modal fade" id="eventModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="eventModalLabel">Rezervasyon Detayları</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="eventModalBody">
                <!-- Event details will be loaded here -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Kapat</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            events: function(info, successCallback, failureCallback) {
                fetch('/api/calendar/events?start=' + info.startStr + '&end=' + info.endStr)
                    .then(response => response.json())
                    .then(data => successCallback(data))
                    .catch(error => failureCallback(error));
            },
            eventClick: function(info) {
                const event = info.event;
                const props = event.extendedProps;

                const modalBody = document.getElementById('eventModalBody');
                modalBody.innerHTML = `
                    <p><strong>Ekipman:</strong> ${props.equipment}</p>
                    <p><strong>Kullanıcı:</strong> ${props.user}</p>
                    <p><strong>Başlangıç:</strong> ${event.start.toLocaleString('tr-TR')}</p>
                    <p><strong>Bitiş:</strong> ${event.end.toLocaleString('tr-TR')}</p>
                    <p><strong>Amaç:</strong> ${props.purpose || 'Belirtilmemiş'}</p>
                    <p><strong>Durum:</strong> <span class="badge bg-${props.status === 'confirmed' ? 'success' : 'secondary'}">${props.status}</span></p>
                `;

                var modal = new bootstrap.Modal(document.getElementById('eventModal'));
                modal.show();
            },
            locale: 'tr',
            buttonText: {
                today: 'Bugün',
                month: 'Ay',
                week: 'Hafta',
                day: 'Gün'
            },
            height: 'auto'
        });

        calendar.render();
    });
</script>
{% endblock %}

name: Build Windows portable and exe

on:
  push:
    branches:
      - internetradyocopilot
  workflow_dispatch: {}

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          } else {
            Write-Host 'requirements.txt not found, installing common build deps'
            pip install pyqt6 pyqt6-plugins pyqtgraph numpy
          }
          pip install pyinstaller

      - name: Show environment info
        shell: powershell
        run: |
          python -V
          pip --version
          pip freeze

      - name: Build portable (one-dir) with PyInstaller
        shell: powershell
        run: |
          pyinstaller --noconfirm --onedir --name "SORT-copilot-Portable" main_gui.py

      - name: Zip portable build
        shell: powershell
        run: |
          $dir = "dist/SORT-copilot-Portable"
          if (Test-Path $dir) {
            $zip = "dist/SORT-copilot-Portable.zip"
            if (Test-Path $zip) { Remove-Item $zip -Force }
            Compress-Archive -Path (Join-Path $dir '*') -DestinationPath $zip -Force
          } else {
            Write-Host "Portable dist not found: $dir"
            exit 1
          }

      - name: Build single-file EXE with PyInstaller
        shell: powershell
        run: |
          pyinstaller --noconfirm --onefile --name "SORT-copilot" main_gui.py

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SORT-copilot-Portable
          path: dist/SORT-copilot-Portable.zip

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: SORT-copilot-exe
          path: dist/SORT-copilot.exe

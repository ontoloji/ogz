# Build Windows portable (one-dir) and single-file EXE (onefile) using PyInstaller
name: Build Windows portable and exe

on:
  push:
    branches:
      - internetradyocopilot
  workflow_dispatch: {}

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          } else {
            Write-Host 'requirements.txt not found, installing common build deps'
            pip install pyqt6 pyqt6-plugins pyqtgraph numpy
          }
          pip install pyinstaller

      - name: Show environment info
        shell: powershell
        run: |
          python -V
          pip --version
          pip freeze

      - name: Discover PyQt6 plugin path (for PyInstaller --add-data)
        id: discover_plugins
        shell: powershell
        run: |
          $code = @"
import importlib, os, sys
try:
    import PyQt6
    import pathlib
    import PyQt6.QtCore as QtCore
    base = os.path.dirname(PyQt6.__file__)
    # Common plugin relative path inside PyQt6 package
    candidates = [
        os.path.join(base, 'Qt6', 'plugins'),
        os.path.join(base, 'Qt', 'plugins'),
    ]
    found = [c for c in candidates if os.path.isdir(c)]
    if not found:
        # Try site-packages lookup
        import pkgutil
        for m in ['PyQt6', 'PyQt6.QtCore']:
            info = pkgutil.get_loader(m)
            if info:
                base = os.path.dirname(info.get_filename())
                c = os.path.join(base, 'Qt6', 'plugins')
                if os.path.isdir(c):
                    found.append(c)
    if found:
        print(found[0])
    else:
        # fallback to empty
        print("")
except Exception as e:
    print("")
"@
          $out = python - <<<'PY'$code$'PY'
          if ($out -ne "") {
            Write-Host "Found plugins at: $out"
            # export to GITHUB_ENV for following steps
            Add-Content -Path $env:GITHUB_ENV -Value ("PYQT6_PLUGINS=" + $out)
          } else {
            Write-Host "PyQt6 plugins not found automatically"
            Add-Content -Path $env:GITHUB_ENV -Value ("PYQT6_PLUGINS=")
          }

      - name: Prepare PyInstaller add-data args
        id: prepare_args
        shell: powershell
        run: |
          $plugins = "${{ env.PYQT6_PLUGINS }}"
          if ([string]::IsNullOrWhiteSpace($plugins)) {
            Write-Host "No plugin path discovered, building without explicit --add-data. You may need to adjust .spec or add manual paths."
            echo "::set-output name=ADDDATA::"
          } else {
            # On Windows, PyInstaller expects add-data in the format "SRC;DEST"
            # We'll map the plugins directory into PyQt6/Qt6/plugins inside the bundle
            $escaped = $plugins -replace '\\','\\\\'
            $arg = "\"$plugins;PyQt6/Qt6/plugins\""
            Write-Host "Using add-data: $arg"
            echo "::set-output name=ADDDATA::$arg"
          }

      - name: Build portable (one-dir) with PyInstaller
        shell: powershell
        run: |
          $add = '${{ steps.prepare_args.outputs.ADDDATA }}'
          if ($add) {
            pyinstaller --noconfirm --onedir --name "SORT-copilot-Portable" --add-data $add main_gui.py
          } else {
            pyinstaller --noconfirm --onedir --name "SORT-copilot-Portable" main_gui.py
          }

      - name: Zip portable build
        shell: powershell
        run: |
          $dir = "dist/SORT-copilot-Portable"
          if (Test-Path $dir) {
            $zip = "dist/SORT-copilot-Portable.zip"
            if (Test-Path $zip) { Remove-Item $zip -Force }
            Compress-Archive -Path (Join-Path $dir '*') -DestinationPath $zip -Force
          } else {
            Write-Host "Portable dist not found: $dir"
            exit 1
          }

      - name: Build single-file EXE with PyInstaller
        shell: powershell
        run: |
          $add = '${{ steps.prepare_args.outputs.ADDDATA }}'
          if ($add) {
            pyinstaller --noconfirm --onefile --name "SORT-copilot" --add-data $add main_gui.py
          } else {
            pyinstaller --noconfirm --onefile --name "SORT-copilot" main_gui.py
          }

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SORT-copilot-Portable
          path: dist/SORT-copilot-Portable.zip

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: SORT-copilot-exe
          path: dist/SORT-copilot.exe
